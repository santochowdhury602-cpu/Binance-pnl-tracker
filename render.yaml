services:
  - type: web
    name: pnl-tracker-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: pcGqBsvpAqKyUL7RrOU46emMdI89rvejxCqT7Vsta8QkbIlH33Ok8eT61a2RThMS
        sync: false
      - key: 4JFcJjRTWSbKt2MMCq5sJChK72XINBP9cg18MP2xyHxL9Gz4aI5wXUYI2prFWMPm
        sync: false
      - key: SPOT_SYMBOLS
        sync: false
      - key: 8876062310:AAHJ5rRTwonb9UsvCDqtJUiZAbLIMYY8u30
        sync: false
      - key: DB_PATH
        value: ./data/pnl.db

  - type: worker
    name: pnl-tracker-bot
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python telegram_bot.py
    envVars:
      - key: 8876062310:AAHJ5rRTwonb9UsvCDqtJUiZAbLIMYY8u30
        sync: false
      - key: WEBAPP_URL
        sync: false
