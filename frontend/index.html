<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>PnL Tracker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <header class="topbar">
      <span class="eyebrow">BINANCE</span>
      <h1 id="totalPnl" class="total-pnl">—</h1>
      <span id="totalSub" class="total-sub">net PnL, all-time</span>
      <canvas id="sparkline" class="sparkline" height="48"></canvas>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="overview">Overview</button>
      <button class="tab" data-tab="assets">By Asset</button>
      <button class="tab" data-tab="history">History</button>
    </nav>

    <main>
      <section id="tab-overview" class="tab-panel active">
        <div class="split-row">
          <div class="stat-card">
            <span class="stat-label">Spot</span>
            <span id="spotNet" class="stat-value">—</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">Futures</span>
            <span id="futNet" class="stat-value">—</span>
          </div>
        </div>
        <div class="cost-breakdown">
          <span class="section-label">Where it went</span>
          <div id="costRows" class="cost-rows"></div>
        </div>
        <button id="syncBtn" class="sync-btn">Sync latest trades</button>
        <p id="syncStatus" class="sync-status"></p>
      </section>

      <section id="tab-assets" class="tab-panel">
        <div id="assetList" class="asset-list"></div>
      </section>

      <section id="tab-history" class="tab-panel">
        <div id="historyList" class="history-list"></div>
      </section>
    </main>

  </div>
  <script src="app.js"></script>
</body>
</html>
